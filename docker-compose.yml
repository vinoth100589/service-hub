version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.3
    container_name: servicehub_postgres
    environment:
      POSTGRES_USER: servicehub
      POSTGRES_PASSWORD: servicehub_pass
      POSTGRES_DB: servicehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicehub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: servicehub_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servicehub_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://servicehub:servicehub_pass@postgres:5432/servicehub
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key
      STRIPE_SECRET_KEY: sk_test_dev
      GOOGLE_MAPS_API_KEY: dev_key
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: servicehub_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
